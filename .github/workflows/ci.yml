name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: #pour relancer le pipeline à la demande

#un seul pipeline par branche, un nouveau push annule le precedent
#on annule jamais sur main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20 #timeoute apres un runneur bloquer
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      #install backend
      - name: install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: install backend deps
        working-directory: backend
        run: |
          uv sync
          cp .env.example .env

      #install frontend
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          cp .env.example .env

      #linter
      - name: linter backend
        working-directory: backend
        run: uv run ruff check .

      - name: linter frontend
        working-directory: frontend
        run: npm run lint

      #tests
      - name: start db
        working-directory: backend/timescaledb-env
        run: docker compose up -d --wait timescaledb

      - name: test backend
        working-directory: backend
        run: uv run pytest --junitxml=pytest-report.xml

      #on attend que l'API reponde
      - name: start backend
        working-directory: backend
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 &
          for i in {1..30}; do curl -sf localhost:8000/api/v1/stations && break; sleep 1; done

      - name: test frontend
        working-directory: frontend
        run: npm run test:ci -- --reporter=default --reporter=junit --outputFile=vitest-report.xml

      #security scan : lit uv.lock / package-lock.json
      #!cancelled() : on veut le rapport meme si un test au dessus a casse,
      #mais pas si l'utilisateur a annule le run (contrairement a always())
      - name: security scan backend
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: json
          output: trivy-code-backend.json
          severity: CRITICAL,HIGH

      - name: security scan frontend
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ./frontend
          format: json
          output: trivy-code-frontend.json
          severity: CRITICAL,HIGH

      #artefacts
      - name: upload test report backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-backend
          path: backend/pytest-report.xml

      - name: upload test report frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-frontend
          path: frontend/vitest-report.xml

      - name: upload scan code backend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-code-backend
          path: trivy-code-backend.json

      - name: upload scan code frontend
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-code-frontend
          path: trivy-code-frontend.json

  docker:
    needs: ci #ne demarre que si le job ci est vert
    runs-on: ubuntu-24.04
    timeout-minutes: 30 #un build docker est plus lent que le job ci
    permissions:
      contents: read
      packages: write #requis pour pousser sur ghcr.io
    strategy:
      fail-fast: false #un service qui casse ne doit pas annuler le rapport de l'autre
      matrix:
        service: [backend, frontend] #un job par image
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      #ghcr.io refuse les majuscules du nom de repo
      - name: image to lower case
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      #buildx necessaire pour le cache de layers GitHub Actions
      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      #scope par service : backend et frontend ne partagent pas leurs layers
      #--load : remet l'image dans le daemon local, sinon trivy ne la trouve pas
      - name: build image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=${{ matrix.service }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.service }} \
            --load \
            -t local/${{ matrix.service }}:ci \
            ./${{ matrix.service }}

      #le CLI et pas l'action : trivy-action n'expose pas d'option --vex
      - name: install trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      #le scan produit un rapport, il ne bloque pas le pipeline.
      #le VEX filtre les CVE qu'on a analysees et jugees non exploitables (cf .trivy/vex.openvex.json)
      #ajouter --exit-code 1 après ajout des image hardened
      - name: scan image
        run: |
          trivy image \
            --format json \
            --output trivy-image-${{ matrix.service }}.json \
            --vex .trivy/vex.openvex.json \
            --severity CRITICAL \
            local/${{ matrix.service }}:ci

      - name: upload trivy report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-${{ matrix.service }}
          path: trivy-image-${{ matrix.service }}.json

      #push : main uniquement
      - name: login ghcr
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #fourni automatiquement

      - name: push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag local/${{ matrix.service }}:ci ghcr.io/$IMAGE/${{ matrix.service }}:${{ github.sha }}
          docker tag local/${{ matrix.service }}:ci ghcr.io/$IMAGE/${{ matrix.service }}:latest
          docker push ghcr.io/$IMAGE/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/$IMAGE/${{ matrix.service }}:latest
